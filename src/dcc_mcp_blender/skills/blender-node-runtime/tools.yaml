tools:
- name: query_targets
  description: Page node owner references without exporting graphs.
  source_file: scripts/query_targets.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      offset: &id001
        type: integer
        minimum: 0
        default: 0
      limit: &id002
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    required: []
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
- name: query_nodes
  description: Read a bounded node page and its incident links.
  source_file: scripts/query_nodes.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      tree_ref: &id003
        type: object
        additionalProperties: false
        required:
        - tree_type
        - owner
        properties:
          tree_type:
            type: string
            enum:
            - ShaderNodeTree
            - CompositorNodeTree
            - GeometryNodeTree
          owner:
            type: object
            additionalProperties: false
            required:
            - kind
            - name
            properties:
              kind:
                type: string
                enum:
                - MATERIAL
                - WORLD
                - LIGHT
                - SCENE
                - NODE_GROUP
              name:
                type: string
                minLength: 1
      offset: *id001
      limit: *id002
      node_names:
        type: array
        maxItems: 100
        items:
          type: string
      link_offset:
        type: integer
        minimum: 0
        default: 0
    required:
    - tree_ref
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
- name: node_schema
  description: Read actual node RNA and current dynamic sockets without probes.
  source_file: scripts/node_schema.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      tree_ref: *id003
      node_name:
        type: string
      offset: *id001
      limit: *id002
    required:
    - tree_ref
    - node_name
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
- name: patch_nodes
  description: Validate a local reversible Shader/Compositor patch, reject stale revisions
    and report real rollback.
  source_file: scripts/patch_nodes.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      tree_ref: *id003
      base_revision:
        type: string
      operations:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: object
      action:
        type: string
        enum:
        - validate
        - apply
        default: apply
      allow_shared:
        type: boolean
        default: false
    required:
    - tree_ref
    - base_revision
    - operations
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: false
  destructive: true
  idempotent: false
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
