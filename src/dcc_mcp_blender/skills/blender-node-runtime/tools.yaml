tools:
- name: query_targets
  description: Page node owner references without exporting graphs.
  source_file: scripts/query_targets.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      offset: &id001
        type: integer
        minimum: 0
        default: 0
      limit: &id002
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    required: []
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
- name: query_nodes
  description: Read a bounded node page and its incident links.
  source_file: scripts/query_nodes.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      tree_ref: &id003
        type: object
        additionalProperties: false
        required:
        - tree_type
        - owner
        properties:
          tree_type:
            type: string
            enum:
            - ShaderNodeTree
            - CompositorNodeTree
            - GeometryNodeTree
          owner:
            type: object
            additionalProperties: false
            required:
            - kind
            - name
            properties:
              kind:
                type: string
                enum:
                - MATERIAL
                - WORLD
                - LIGHT
                - SCENE
                - NODE_GROUP
              name:
                type: string
                minLength: 1
      offset: *id001
      limit: *id002
      node_names:
        type: array
        maxItems: 100
        items:
          type: string
      link_offset:
        type: integer
        minimum: 0
        default: 0
    required:
    - tree_ref
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
- name: node_schema
  description: Read actual node RNA and current dynamic sockets without probes.
  source_file: scripts/node_schema.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      tree_ref: *id003
      node_name:
        type: string
      offset: *id001
      limit: *id002
    required:
    - tree_ref
    - node_name
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: true
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
- name: patch_nodes
  description: Validate a local reversible Shader/Compositor patch, reject stale revisions
    and report real rollback.
  source_file: scripts/patch_nodes.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      tree_ref: *id003
      base_revision:
        type: string
      operations:
        type: array
        minItems: 1
        maxItems: 100
        items:
          type: object
      action:
        type: string
        enum:
        - validate
        - apply
        default: apply
      allow_shared:
        type: boolean
        default: false
    required:
    - tree_ref
    - base_revision
    - operations
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: false
  destructive: true
  idempotent: false
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
- name: preview_variants
  description: Capture bounded socket, link, RNA and object-local material slot candidates in the current viewport
    with one call, restore the baseline after each candidate, and return image paths
    and a manifest without saving a blend file.
  source_file: scripts/preview_variants.py
  execution: sync
  affinity: main
  timeout_hint_secs: 0
  input_schema:
    type: object
    additionalProperties: false
    properties:
      targets:
        type: array
        minItems: 1
        maxItems: 16
        items:
          oneOf:
          - type: object
            additionalProperties: false
            required: [id, tree_ref, base_revision]
            properties:
              id:
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
              tree_ref: *id003
              base_revision:
                type: string
              allow_shared:
                type: boolean
                default: false
          - type: object
            additionalProperties: false
            required: [id, owner, path, base_value]
            properties:
              id:
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
              owner:
                type: object
                additionalProperties: false
                required: [type, name]
                properties:
                  type:
                    const: object
                  name:
                    type: string
              path:
                type: string
                description: Native light data.energy/data.color, object hide_render/hide_viewport, or existing Displace modifiers["name"].strength.
              base_value:
                oneOf:
                - type: number
                - type: boolean
                - type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: number
          - type: object
            additionalProperties: false
            required: [id, owner, material_slot, base_link, base_material]
            properties:
              id:
                type: string
                pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
              owner:
                type: object
                additionalProperties: false
                required: [type, name]
                properties:
                  type:
                    const: object
                  name:
                    type: string
                    minLength: 1
              material_slot:
                type: integer
                minimum: 0
              base_link:
                enum: [DATA, OBJECT]
              base_material:
                type: [string, 'null']
                minLength: 1
                description: Current effective material name, or null for an empty slot. Both binding fields must match.
      variants:
        type: array
        minItems: 1
        maxItems: 16
        items:
          type: object
          additionalProperties: false
          required: [id, patches]
          properties:
            id:
              type: string
              pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
            patches:
              type: array
              minItems: 0
              maxItems: 16
              items:
                type: object
                additionalProperties: false
                required: [target, operations]
                properties:
                  target:
                    type: string
                  operations:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                      oneOf:
                      - type: object
                        additionalProperties: false
                        required: [op, node, socket, value]
                        properties:
                          op:
                            enum: [set_input, set_output]
                          node:
                            type: string
                          socket:
                            type: string
                          value:
                            anyOf:
                            - type: number
                            - type: boolean
                            - type: string
                            - type: array
                              minItems: 1
                              items:
                                anyOf:
                                - type: number
                                - type: boolean
                                - type: string
                      - type: object
                        additionalProperties: false
                        required: [op, from_node, from_socket, to_node, to_socket]
                        properties:
                          op:
                            enum: [connect, disconnect]
                          from_node:
                            type: string
                          from_socket:
                            type: string
                          to_node:
                            type: string
                          to_socket:
                            type: string
                      - type: object
                        additionalProperties: false
                        required: [op, value]
                        properties:
                          op:
                            const: set_property
                          value:
                            oneOf:
                            - type: number
                            - type: boolean
                            - type: array
                              minItems: 1
                              maxItems: 32
                              items:
                                type: number
                      - type: object
                        additionalProperties: false
                        required: [op, material]
                        properties:
                          op:
                            const: set_material
                          material:
                            type: string
                            minLength: 1
                            description: Existing material name. One operation per material slot patch; material nodes are never edited.
      output_directory:
        type: string
        minLength: 1
        description: Absolute destination directory; existing manifest or candidate PNGs are rejected.
      resolution_x:
        type: integer
        minimum: 16
        maximum: 4096
        default: 1200
      resolution_y:
        type: integer
        minimum: 16
        maximum: 4096
        default: 1000
    required: [targets, variants, output_directory]
  output_schema:
    type: object
    additionalProperties: true
    required: [success]
    properties:
      success:
        type: boolean
  read_only: false
  destructive: false
  idempotent: false
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: false
    open_world_hint: false
