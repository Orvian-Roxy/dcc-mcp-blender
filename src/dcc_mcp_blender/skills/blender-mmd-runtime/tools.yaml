tools:
  - name: list_methods
    description: "List the 16 public native MMD methods with their plugin and phase, without importing the optional provider."
    source_file: scripts/list_methods.py
    execution: sync
    affinity: main
    timeout_hint_secs: 0
    input_schema:
      type: object
      additionalProperties: false
      properties: {}
    output_schema:
      type: object
      additionalProperties: true
    read_only: true
    destructive: false
    idempotent: true
    annotations:
      read_only_hint: true
      destructive_hint: false
      idempotent_hint: true
      open_world_hint: false

  - name: call
    description: "Execute one public native MMD method on the main thread, returning its original status, diagnostics and receipt. Check capabilities before mutation."
    source_file: scripts/call.py
    execution: sync
    affinity: main
    timeout_hint_secs: 30
    input_schema:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          type: string
          enum:
            - mmd.inspect
            - mmd.toon.capabilities
            - mmd.toon.inspect
            - mmd.toon.plan
            - mmd.toon.apply
            - mmd.toon.validate
            - mmd.toon.restore
            - mmd.mbts.capabilities
            - mmd.mbts.plan
            - mmd.mbts.execute
            - mmd.wiggle.capabilities
            - mmd.wiggle.inspect
            - mmd.wiggle.plan
            - mmd.wiggle.apply
            - mmd.wiggle.validate
            - mmd.wiggle.restore
        parameters:
          type: object
          additionalProperties: true
          default: {}
    output_schema:
      type: object
      additionalProperties: true
    read_only: false
    destructive: true
    idempotent: false
    annotations:
      read_only_hint: false
      destructive_hint: true
      idempotent_hint: false
      open_world_hint: true
