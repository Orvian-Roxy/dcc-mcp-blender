tools:
- name: prepare
  description: Attach NodeBPY dependencies and check actual runtime readiness.
  source_file: scripts/prepare.py
  execution: sync
  affinity: main
  timeout_hint_secs: 30
  input_schema:
    type: object
    additionalProperties: false
    required:
    - project_root
    properties:
      project_root:
        type: string
        minLength: 1
      extra_paths:
        type: array
        items:
          type: string
      addon_module:
        type: string
        minLength: 1
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: false
  destructive: false
  idempotent: true
  annotations:
    read_only_hint: false
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: true
- name: project
  description: Check inputs, build a fresh candidate or verify current NodeBPY edits.
  source_file: scripts/project.py
  execution: sync
  affinity: main
  timeout_hint_secs: 300
  input_schema:
    type: object
    additionalProperties: false
    required:
    - project_root
    - action
    - game
    - profile
    - output
    properties:
      project_root:
        type: string
        minLength: 1
      action:
        type: string
        enum:
        - check
        - run
        - verify
      game:
        type: string
        enum: [genshin, Genshin, wuwa, WutheringWaves, zzz, ZenlessZoneZero, hsr, HonkaiStarRail]
      profile:
        type: string
      output:
        type: string
      full:
        type: boolean
        default: false
        description: Return full current-call details; successful builds retain report_path for later reading.
  output_schema:
    type: object
    additionalProperties: true
    required:
    - success
    properties:
      success:
        type: boolean
  read_only: false
  destructive: true
  idempotent: false
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: true
